name: check

on:
  # GitHub's schedule runs late when it is busy, a few minutes at most; the status page allows for half an hour.
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write # publishing status.json on the data branch
  actions: write # keeping the schedule alive (the last step)

concurrency:
  group: check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Fetch the results so far
        run: git fetch --depth=1 origin data && git show origin/data:status.json > status.json || echo "No results yet: starting over."

      - name: Ping
        run: node check.mjs status.json

      # The data branch is a single commit, replaced on every run: the history lives in the file, not in git.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir publish && cp status.json publish/
          cd publish
          git init -q -b data
          git add status.json
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qm "status $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -fq "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data

      # GitHub turns off the schedule of a repository with no activity for 60 days; enabling it again resets that.
      - name: Keep the schedule alive
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/check.yml/enable"
